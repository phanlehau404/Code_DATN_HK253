; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[common]
default_envs = yolo_uno
main_file = src/main.cpp
[env:yolo_uno]
platform = espressif32
board = yolo_uno
framework = arduino
build_unflags = -Os
build_flags =
    -O1
monitor_speed = 115200
lib_deps = 
    ; thingsboard/ThingsBoard@^0.15.0
    ; mathieucarbou/ESPAsyncWebServer@^3.6.0    ;để tạo webserver không đồng bộ
    ; DHT20@0.3.1
    ; WiFi@2.0.0
    PubSubClient@2.8
    ArduinoJson@6.21.2
    tinyu-zhao/INA3221 @ ^0.0.1
    paulstoffregen/OneWire
    milesburton/DallasTemperature
lib_extra_dirs =
    lib
    lib/Utils
lib_ldf_mode = deep  # Ensures that dependencies are correctly resolved
board_build.filesystem = littlefs

; Ignore file
build_src_filter = -<experiments_mppt.cpp> +<main.cpp> -<test_mppt.cpp> -<temperature_measure.cpp>
